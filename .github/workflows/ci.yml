name: Native Swift MCP
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: apt-get update && apt-get install -y libssl-dev zlib1g-dev python3 openssl
      - name: Unit and contract tests
        run: swift test --disable-automatic-resolution -j 2
      - name: Real HTTP MCP and OAuth smoke
        run: python3 Scripts/ci/http_mcp_smoke.py --binary .build/debug/asc-mcp
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway image
        run: docker build -t apple-store-connect-mcp:ci .
      - name: Real MCP in the final Railway image
        run: python3 Scripts/ci/http_mcp_smoke.py --binary Scripts/ci/docker_mcp_launcher.sh
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Unit and contract tests
        run: swift test --disable-automatic-resolution
      - name: Real HTTP MCP and OAuth smoke
        run: python3 Scripts/ci/http_mcp_smoke.py --binary .build/debug/asc-mcp
